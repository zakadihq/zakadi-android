# Zakadi repository standard: git hooks (lefthook 2.x), Kotlin with Gradle (Android).
# These are the commands .github/workflows/ci.yml runs; a change here is a change there.
# Install: brew install lefthook, then lefthook install. The integration job needs an
# emulator, so it runs in CI only.

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: secrets
      glob: "**/.env*"
      run: 'echo "secrets: {staged_files} must not be committed (spec 00 0.11)" >&2; exit 1'
    - name: format
      glob: "*.{kt,kts}"
      run: ./gradlew --quiet spotlessCheck
    - name: lint
      glob: "*.{kt,kts,xml,toml}"
      run: ./gradlew --quiet lint

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    - name: unit
      run: ./gradlew --quiet test
