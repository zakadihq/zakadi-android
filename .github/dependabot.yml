# Zakadi repository standard: Dependabot.
# One entry per ecosystem the repository contains, one per directory holding a manifest,
# plus github-actions. Gradle reads gradle/libs.versions.toml and the wrapper.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
