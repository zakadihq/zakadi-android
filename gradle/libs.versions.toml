# Versions of spec/07-native-mobile-sdk.md 7.17; Dependabot moves them.
[versions]
agp = "9.4.1"
androidx-test-runner = "1.7.0"
junit = "4.13.2"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
ktfmt = "0.64"
licensee = "1.14.1"
spotless = "8.10.2"

[libraries]
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# The formatter Spotless runs; declared here so that Dependabot updates it.
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The licence check of the scan step in ci.yml (Apache-2.0), on each module.
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
